<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F86A3">
<title>DW Depósito</title>
<link rel="icon" href="https://raw.githubusercontent.com/juandwein/dw-assets/main/dw-deposito-wms.png">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--top:#4F86A3;--toptx:#fff;--nar:#E08A52;--marco:#F2B184}
.o{--top:#1B2E39;--toptx:#E7EEF2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0B1216;color:#fff;font-family:'Quicksand',system-ui,sans-serif;font-weight:600;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--top);color:var(--toptx)}
.top h1{margin:0;font-size:18px;font-weight:700;flex:1}
.tb{height:42px;width:42px;border:none;border-radius:999px;background:rgba(255,255,255,.18);color:var(--toptx);display:flex;align-items:center;justify-content:center;font-size:23px;cursor:pointer}
.tb.on{background:var(--nar);color:#fff}
#cam{position:fixed;inset:0}
video{width:100%;height:100%;object-fit:cover}
#marco{position:absolute;left:50%;top:46%;width:min(68vw,320px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:22px;box-shadow:0 0 0 9999px rgba(11,18,22,.55)}
#marco:before,#marco:after{content:"";position:absolute;inset:0;border-radius:22px;border:4px solid var(--marco);-webkit-mask:linear-gradient(#000 0 0) top/100% 22% no-repeat,linear-gradient(#000 0 0) bottom/100% 22% no-repeat;mask:linear-gradient(#000 0 0) top/100% 22% no-repeat,linear-gradient(#000 0 0) bottom/100% 22% no-repeat}
#marco:after{-webkit-mask:linear-gradient(#000 0 0) left/22% 100% no-repeat,linear-gradient(#000 0 0) right/22% 100% no-repeat;mask:linear-gradient(#000 0 0) left/22% 100% no-repeat,linear-gradient(#000 0 0) right/22% 100% no-repeat}
#linea{position:absolute;left:8%;right:8%;height:3px;border-radius:3px;background:var(--marco);opacity:.85;animation:barre 2s ease-in-out infinite}
@keyframes barre{0%,100%{top:12%}50%{top:86%}}
#msg{position:fixed;left:0;right:0;bottom:0;padding:22px 16px calc(26px + env(safe-area-inset-bottom));text-align:center;font-size:17px;font-weight:700;background:linear-gradient(transparent,rgba(11,18,22,.85))}
#ok{display:none;position:fixed;inset:0;z-index:4;background:rgba(11,18,22,.55);align-items:center;justify-content:center}
#ok i{font-size:84px;color:#fff;background:#2E8B6E;border-radius:50%;padding:14px}
#res{display:none;position:fixed;inset:0;z-index:5;background:#EEF3F6;color:#1E2B33;padding:24px;flex-direction:column;gap:14px;justify-content:center;text-align:center}
#code{font-size:26px;font-weight:700;word-break:break-all}
#res button{border:none;border-radius:14px;padding:15px;font-family:inherit;font-weight:700;font-size:16px;background:#4F86A3;color:#fff}
</style>
</head>
<body>
<header class="top">
  <button class="tb" onclick="cerrar()" aria-label="Volver"><i class="ti ti-arrow-left"></i></button>
  <h1>Escanear</h1>
  <button class="tb" id="bT" style="display:none" onclick="linterna()" aria-label="Linterna"><i class="ti ti-bulb"></i></button>
</header>
<div id="cam"><video id="vid" playsinline muted autoplay></video><div id="marco"><div id="linea"></div></div></div>
<div id="msg">Apuntá al código</div>
<div id="ok"><i class="ti ti-check"></i></div>
<div id="res"><div>Código leído</div><div id="code"></div><button onclick="copiar()">Copiar</button></div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
if (/[?&]t=o/.test(location.search)) document.documentElement.classList.add('o');
let stream = null, det = null, cv = null, luz = false;
const $ = id => document.getElementById(id);
const msg = t => { $('msg').textContent = t; };
async function iniciar() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } });
  } catch (e) {
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true }); }
    catch (e2) { return msg('Permití el uso de la cámara para escanear.'); }
  }
  const v = $('vid'); v.srcObject = stream;
  try { await v.play(); } catch (e) {}
  try { const caps = stream.getVideoTracks()[0].getCapabilities(); if (caps.torch) $('bT').style.display = ''; } catch (e) {}
  if ('BarcodeDetector' in window) {
    try { const f = await BarcodeDetector.getSupportedFormats(); if (f.indexOf('qr_code') >= 0) det = new BarcodeDetector({ formats: f.filter(x => ['qr_code', 'code_128', 'code_39', 'ean_13', 'ean_8', 'itf'].indexOf(x) >= 0) }); } catch (e) { det = null; }
  }
  bucle();
}
async function bucle() {
  const v = $('vid');
  if (v.readyState >= 2 && v.videoWidth) {
    try {
      if (det) { const r = await det.detect(v); if (r && r.length) return listo(r[0].rawValue); }
      else if (window.jsQR) {
        const sc = Math.min(1, 720 / Math.max(v.videoWidth, v.videoHeight)); cv = cv || document.createElement('canvas');
        cv.width = Math.round(v.videoWidth * sc); cv.height = Math.round(v.videoHeight * sc);
        const ctx = cv.getContext('2d', { willReadFrequently: true }); ctx.drawImage(v, 0, 0, cv.width, cv.height);
        const r = jsQR(ctx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, { inversionAttempts: 'attemptBoth' });
        if (r && r.data) return listo(r.data);
      }
    } catch (e) { det = null; }
  }
  setTimeout(bucle, 120);
}
function parar() { if (stream) { stream.getTracks().forEach(x => x.stop()); stream = null; } }
function listo(t) {
  t = String(t).trim();
  try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
  parar();
  $('ok').style.display = 'flex';
  if (window.opener) {
    try { window.opener.postMessage({ dwScan: t }, '*'); setTimeout(() => window.close(), 220); return; } catch (e) {}
  }
  $('ok').style.display = 'none';
  $('code').textContent = t;
  $('res').style.display = 'flex';
}
async function linterna() {
  try { luz = !luz; await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: luz }] }); $('bT').classList.toggle('on', luz); } catch (e) {}
}
function copiar() { const t = $('code').textContent; if (navigator.clipboard) navigator.clipboard.writeText(t); }
function cerrar() { parar(); window.close(); }
iniciar();
</script>
</body>
</html>
