<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#F4F4F2;--card:#FFFFFF;--tx:#2C2C2A;--mu:#6B6A65;--bd:#DEDCD4;--ac:#1D9E75;--er:#A32D2D;--erbg:#FCEBEB;--okbg:#E1F5EE;--wn:#854F0B;--wnbg:#FAEEDA;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Quicksand',system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit;font-size:15px;color:var(--tx)}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#FFC20E;color:#2C2C2A}
.brand{font-weight:700;font-size:17px;display:flex;gap:8px;align-items:center;cursor:pointer}
.who{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600}
.who button{border:1px solid rgba(0,0,0,.25);background:rgba(255,255,255,.55);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.who button.fs{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;font-size:18px}
#main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
body.admin #main{max-width:1240px}
.hello{font-weight:700;font-size:18px;margin:4px 2px 10px}
.search{display:flex;gap:8px;margin-bottom:14px}
.search input{flex:1}
input,select{width:100%;border:1px solid var(--bd);border-radius:10px;padding:11px 12px;background:#fff;outline:none}
input:focus,select:focus{border-color:#888780}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:none;border-radius:16px;color:#fff;min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:16px;cursor:pointer;padding:12px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tile i{font-size:40px}
.tile:active{transform:scale(.98)}
.vh{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.vh h2{margin:0;font-size:20px;font-weight:700}
.back,.icon{border:1px solid var(--bd);background:#fff;border-radius:10px;width:46px;min-width:46px;height:46px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px}
.card,.line{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px;position:relative}
.lb{display:block;font-size:12px;font-weight:700;color:var(--mu);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.02em}
.lb:first-child{margin-top:0}
.fld{display:flex;gap:8px}
.desc{font-size:13px;color:var(--mu);margin-top:5px;min-height:16px}
.x{position:absolute;top:8px;right:8px;border:none;background:transparent;font-size:20px;color:var(--mu);cursor:pointer;z-index:2}
.add{width:100%;border:1.5px dashed #B4B2A9;background:transparent;border-radius:10px;padding:12px;font-weight:600;color:var(--mu);cursor:pointer;margin-bottom:12px}
.primary{width:100%;border:none;background:#2C2C2A;color:#fff;border-radius:12px;padding:15px;font-weight:700;font-size:16px;cursor:pointer}
.primary:disabled{opacity:.5}
.sec{width:100%;border:1px solid var(--bd);background:#fff;border-radius:12px;padding:13px;font-weight:600;cursor:pointer;margin-top:10px}
.danger{color:var(--er)}
.btn{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap}
.muted{color:var(--mu);font-size:13px}
.errbox{background:var(--erbg);color:var(--er);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px;font-weight:600}
.warn{background:var(--wnbg);color:var(--wn);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px;font-weight:600}
.okbox{background:var(--okbg);color:#085041;border-radius:10px;padding:12px;margin:0 0 12px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.seg button{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:10px 4px;font-weight:600;font-size:13px;cursor:pointer}
.seg button.on{background:#2C2C2A;color:#fff;border-color:#2C2C2A}
.np{display:flex;justify-content:space-between;align-items:center;gap:10px}
.timer{background:#FAECE7;color:#712B13;border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.rh{font-weight:700;margin-right:24px}
.pick{display:grid;grid-template-columns:1fr 46px 96px 30px;gap:6px;margin-top:8px;align-items:center}
.pick .x{position:static}
.li{padding:10px 2px;border-bottom:1px solid var(--bd);cursor:pointer;font-size:14px}
.li:last-child{border:none}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--mu);font-weight:700;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
.tbl td{padding:8px 6px;border-bottom:1px solid #EEEDE8;vertical-align:top}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.t-ok{background:var(--okbg);color:#085041}.t-er{background:var(--erbg);color:var(--er)}.t-mu{background:#F1EFE8;color:#444441}.t-wn{background:var(--wnbg);color:var(--wn)}
.adm{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;align-items:start}
.side{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:2px;position:sticky;top:64px}
.si{display:flex;gap:10px;align-items:center;border:none;background:transparent;border-radius:9px;padding:10px 12px;font-weight:600;color:var(--mu);cursor:pointer;text-align:left}
.si i{font-size:19px}
.si.sel{background:#F1EFE8;color:var(--tx)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px}
.kpi p{margin:0}
.kl{font-size:12px;color:var(--mu);font-weight:600}
.kv{font-size:26px;font-weight:700;margin-top:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.filters>div{min-width:150px}
.bars{display:flex;align-items:flex-end;gap:4px;height:130px;margin-top:10px}
.bars div{flex:1;background:#7F77DD;border-radius:4px 4px 0 0;min-height:2px}
.occ{height:8px;background:#EEEDE8;border-radius:999px;overflow:hidden;margin-top:8px}
.occ div{height:100%;background:#1D9E75}
h3{margin:0 0 10px;font-size:16px;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;padding:14px;width:100%;max-width:420px}
#cam{position:relative;width:100%;aspect-ratio:3/4;max-height:62vh;border-radius:12px;overflow:hidden;background:#111}
#vid{width:100%;height:100%;object-fit:cover;display:block}
#marco{position:absolute;inset:18%;border:3px solid #FFC20E;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.mrow{display:flex;gap:8px;margin-top:10px}
.mrow>*{flex:1;text-align:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2C2C2A;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%}
.toast.on{opacity:1}.toast.ok{background:#0F6E56}.toast.err{background:#A32D2D}
@media (max-width:820px){.adm{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;position:static}.si span{white-space:nowrap}}
#print{display:none}
.lbl{width:99mm;height:59mm;box-sizing:border-box;border:.5mm solid #000;font-family:Arial,Helvetica,sans-serif;color:#000;display:flex;flex-direction:column;background:#fff}
.lh{display:flex;justify-content:space-between;padding:1.6mm 2.5mm;font-weight:700;font-size:12pt;border-bottom:.5mm solid #000}
.lm{flex:1;display:flex;align-items:center;gap:2mm;padding:1mm 2mm}
.lq img,.lq canvas{width:32mm!important;height:32mm!important}
.lr{flex:1}
.segs{display:flex;gap:1.5mm}
.sg{border:.5mm solid #000;flex:1;text-align:center}
.sg:nth-child(2){flex:1.35}
.sc{font-size:6pt;font-weight:700;border-bottom:.3mm solid #000;padding:.6mm 0}
.sv{font-size:24pt;font-weight:700;padding:1.2mm 0}
.lc{font-family:'Courier New',monospace;font-weight:700;font-size:9pt;text-align:center;margin-top:1.2mm}
.arr{width:8mm;height:24mm}
.lf{border-top:.5mm solid #000;text-align:center;font-weight:700;font-size:9pt;padding:1.3mm}
@media print{@page{size:99mm 59mm;margin:0}body{background:#fff}body>*:not(#print){display:none!important}#print{display:block}}
</style>
</head>
<body>
<header class="top">
  <div class="brand" onclick="irInicio()"><img src="https://raw.githubusercontent.com/juandwein/dw-assets/main/dw-deposito-wms-64.png" alt="" width="26" height="26"> DW Depósito</div>
  <div class="who" id="who"></div>
</header>
<main id="main"><p class="muted">Cargando…</p></main>

<div class="modal" id="modal">
  <div class="mbox">
    <div id="cam"><video id="vid" playsinline muted autoplay></video><div id="marco"></div></div>
    <p id="scanMsg" class="muted" style="text-align:center;font-weight:600"></p>
    <div class="mrow">
      <button class="btn" id="bLinterna" style="display:none" onclick="linterna()"><i class="ti ti-bulb"></i> Linterna</button>
      <label class="btn"><i class="ti ti-camera"></i> Sacar foto<input type="file" accept="image/*" capture="environment" style="display:none" onchange="scanFoto(this)"></label>
      <button class="btn" onclick="cerrarScanner()">Cancelar</button>
    </div>
    <button class="sec" id="bVentana" style="display:none" onclick="abrirVentanaScan()"><i class="ti ti-external-link"></i> Abrir la cámara en otra ventana</button>
    <p style="text-align:center;margin:10px 0 0"><a href="#" class="muted" onclick="usarCamaraAca();return false">Probar la cámara en esta pantalla</a></p>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="print"></div>

<script async src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const S = { pwa: false, u: null, modo: 'op', adminSec: null, ing: null, mov: null, ped: null, cnt: null, timers: [], ultUbic: null, ubicLista: [] };
const ADMIN_SECS = [
  ['encurso', 'En curso', 'ti-layout-dashboard'], ['pedidos', 'Pedidos', 'ti-clipboard-list'], ['operarios', 'Operarios', 'ti-users'],
  ['ubicaciones', 'Ubicaciones', 'ti-map-pin'], ['movimientos', 'Movimientos', 'ti-arrows-exchange'], ['diferencias', 'Diferencias ERP', 'ti-scale'],
  ['alertas', 'Alertas', 'ti-bell'], ['config', 'Configuración', 'ti-settings']
];
const DESTINOS = [['CLIENTE', 'Cliente'], ['PT', 'Pedidos terminados'], ['FULL', 'Full'], ['EFLET', 'Eflet']];

const $ = id => document.getElementById(id);
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmt(n) { return Number(n || 0).toLocaleString('es-AR'); }
function run(fn, ...a) { return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e && e.message ? e : new Error(String(e))))[fn](...a)); }
function toast(m, t) { const el = $('toast'); el.textContent = m; el.className = 'toast on ' + (t || ''); clearTimeout(toast._t); toast._t = setTimeout(() => { el.className = 'toast'; }, 3500); }
function has(p) { return !!(S.u && S.u.permisos.indexOf(p) >= 0); }
function esAdmin() { return ADMIN_SECS.some(s => has(s[0])); }
function render(html) { S.timers.forEach(clearInterval); S.timers = []; $('main').innerHTML = html; window.scrollTo(0, 0); }
function guardar(k, v) { try { localStorage.setItem('dwdep_' + k, JSON.stringify(v)); } catch (e) {} }
function cargar(k) { try { return JSON.parse(localStorage.getItem('dwdep_' + k) || 'null'); } catch (e) { return null; } }
function borrar(k) { try { localStorage.removeItem('dwdep_' + k); } catch (e) {} }
function head(t) { return `<div class="vh"><button class="back" onclick="irInicio()" aria-label="Volver"><i class="ti ti-arrow-left"></i></button><h2>${t}</h2></div>`; }
function campo(lb, id, val, onch, extra) {
  return `<label class="lb">${lb}</label><div class="fld"><input id="${id}" value="${esc(val)}" onchange="${onch}" ${extra || ''}><button class="icon" onclick="escanearA('${id}')" aria-label="Escanear"><i class="ti ti-scan"></i></button></div>`;
}
function mostrarErr(list) { const el = $('err'); if (el) { el.innerHTML = `<div class="errbox">${list.map(esc).join('<br>')}</div>`; el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } else toast(list[0], 'err'); }
function hoyISO(d) { const x = d || new Date(); return new Date(x.getTime() - x.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function minTxt(m) { m = Math.max(0, Math.round(m)); return m >= 60 ? Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' min' : m + ' min'; }
function tabla(cols, rows) {
  return `<div class="tw"><table class="tbl"><thead><tr>${cols.map(c => `<th class="${c[1] || ''}">${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.length ? rows.map(r => `<tr>${r.map((v, i) => `<td class="${cols[i][1] || ''}">${v}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}" class="muted">Sin datos.</td></tr>`}</tbody></table></div>`;
}
function kpis(list) { return `<div class="kpis">${list.map(k => `<div class="kpi"><p class="kl">${k[0]}</p><p class="kv" style="${k[2] || ''}">${k[1]}</p></div>`).join('')}</div>`; }

/* ---------------- Inicio ---------------- */
window.onerror = function (m, src, l) {
  if (S.u) return;
  const el = document.getElementById('main');
  if (el) el.innerHTML = '<div class="errbox">Error en la página: ' + esc(m) + ' (línea ' + l + ')</div>';
};
const bootT = setTimeout(() => {
  if (S.u) return;
  render(`<div class="card"><h3>La app no responde</h3><p class="muted">No llegó respuesta del servidor. Probá esto:</p>
    <p class="muted">1. Abrí la app en una ventana de incógnito, con una sola cuenta de Google iniciada (la de @dw.com.ar).<br>
    2. Verificá que se ejecutó <b>setup()</b> en el editor de Apps Script.<br>
    3. En Apps Script, revisá <b>Ejecuciones</b> para ver si <b>getBoot</b> dio error.</p>
    <button class="sec" onclick="location.reload()">Reintentar</button></div>`);
}, 20000);
try { google.script.url.getLocation(l => { S.pwa = !!(l && l.parameter && l.parameter.modo === 'pwa'); pintarWho(); }); } catch (e) {}
run('getBoot').then(b => {
  clearTimeout(bootT);
  S.u = b.usuario;
  if (has('operario')) home(); else adminHome();
}).catch(e => { clearTimeout(bootT); render(`<div class="card"><h3>Sin acceso</h3><p class="muted">${esc(e.message)}</p></div>`); });

function pintarWho() {
  if (!S.u) return;
  const sw = has('operario') && esAdmin() ? `<button onclick="${S.modo === 'admin' ? 'home()' : 'adminHome()'}">${S.modo === 'admin' ? 'Operario' : 'Panel'}</button>` : '';
  const fs = fsPosible() ? `<button class="fs" onclick="toggleFS()" aria-label="${fsOn() ? 'Salir de pantalla completa' : 'Pantalla completa'}"><i class="ti ${fsOn() ? 'ti-minimize' : 'ti-maximize'}"></i></button>` : '';
  $('who').innerHTML = `${sw}<span>${esc(S.u.nombre)}</span>${fs}`;
  document.body.classList.toggle('admin', S.modo === 'admin');
}

/* ---------------- Pantalla completa ---------------- */
function fsPosible() { if (S.pwa) return false; const el = document.documentElement; return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) && !!(el.requestFullscreen || el.webkitRequestFullscreen); }
function fsOn() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function pedirFS() {
  if (!fsPosible() || fsOn()) return;
  const el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
  try { const p = f.call(el, { navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {}); } catch (e) {}
}
function salirFS() { const f = document.exitFullscreen || document.webkitExitFullscreen; if (f && fsOn()) { try { const p = f.call(document); if (p && p.catch) p.catch(() => {}); } catch (e) {} } }
function toggleFS() { if (fsOn()) { guardar('fs', 0); salirFS(); } else { guardar('fs', 1); pedirFS(); } }
/* El operario arranca siempre en pantalla completa: el navegador exige un toque, así que se activa con el primero. */
document.addEventListener('pointerdown', e => {
  if (!S.u || S.pwa || S.modo !== 'op' || cargar('fs') === 0 || fsOn()) return;
  if (e.target.closest && e.target.closest('.fs')) return;
  pedirFS();
}, true);
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, pintarWho));
function irInicio() { if (!S.u) return; if (S.modo === 'admin' || !has('operario')) adminHome(); else home(); }

function home() {
  S.modo = 'op'; pintarWho();
  const t = [['preparar', 'Preparar pedido', 'ti-clipboard-list', '#D85A30'], ['ingresar', 'Ingresar mercadería', 'ti-package-import', '#1D9E75'],
    ['mover', 'Mover / reacomodar', 'ti-arrows-exchange', '#378ADD'], ['consultar', 'Consultar', 'ti-search', '#BA7517'],
    ['conteo', 'Conteo', 'ti-list-numbers', '#7F77DD'], ['mismov', 'Mis movimientos', 'ti-history', '#5F5E5A']];
  if (esAdmin()) t.push(['panel', 'Panel de administración', 'ti-chart-bar', '#2C2C2A']);
  const np = cargar('ped_actual');
  render(`<div class="hello">Hola, ${esc(S.u.nombre)}</div>
  <div class="search"><input id="q" placeholder="Buscar o escanear" onkeydown="if(event.key==='Enter')vConsultar(this.value)"><button class="icon" onclick="escanear(v=>vConsultar(v))" aria-label="Escanear"><i class="ti ti-scan"></i></button></div>
  ${np ? `<div class="warn" style="cursor:pointer" onclick="vPreparar()">Tenés el pedido NP ${esc(np)} sin terminar. Tocá para seguir.</div>` : ''}
  <div class="tiles">${t.map(x => `<button class="tile" style="background:${x[3]}" onclick="abrir('${x[0]}')"><i class="ti ${x[2]}"></i><span>${x[1]}</span></button>`).join('')}</div>`);
}
function abrir(v) { ({ preparar: vPreparar, ingresar: vIngresar, mover: vMover, consultar: () => vConsultar(''), conteo: vConteo, mismov: vMisMov, panel: () => adminHome() })[v](); }

/* ---------------- Escáner (cámara en vivo, foto o lector tipo pistola) ---------------- */
const SCANNER_URL = 'https://juandwein.github.io/dw-assets/scanner.html';
const CAM = { stream: null, t: 0, det: null, cv: null, torch: false };
let SCB = null;
function escanearA(id) { escanear(v => { const el = $(id); if (!el) return; el.value = v; el.dispatchEvent(new Event('change')); }); }
function scanMsg(m) { $('scanMsg').textContent = m; }
async function escanear(cb) {
  SCB = cb;
  $('modal').classList.add('on'); $('bVentana').style.display = 'none'; $('bLinterna').style.display = 'none';
  if (cargar('scan_ventana')) { $('cam').style.display = 'none'; return abrirVentanaScan(); }
  $('cam').style.display = '';
  scanMsg('Abriendo la cámara…');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camError({ name: 'SinSoporte', message: '' });
  try {
    CAM.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } });
  } catch (e) {
    try { CAM.stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false }); } catch (e2) { return camError(e2); }
  }
  if (!$('modal').classList.contains('on')) return pararCam();
  const v = $('vid'); v.srcObject = CAM.stream;
  try { await v.play(); } catch (e) {}
  scanMsg('Apuntá al código dentro del recuadro.');
  try { const tr = CAM.stream.getVideoTracks()[0]; const caps = tr.getCapabilities ? tr.getCapabilities() : {}; if (caps.torch) $('bLinterna').style.display = ''; } catch (e) {}
  CAM.det = null;
  if ('BarcodeDetector' in window) {
    try { const f = await BarcodeDetector.getSupportedFormats(); if (f.indexOf('qr_code') >= 0) CAM.det = new BarcodeDetector({ formats: f.filter(x => ['qr_code', 'code_128', 'code_39', 'ean_13', 'ean_8', 'itf'].indexOf(x) >= 0) }); } catch (e) { CAM.det = null; }
  }
  bucle();
}
async function bucle() {
  if (!CAM.stream) return;
  const v = $('vid');
  if (v.readyState >= 2 && v.videoWidth) {
    try {
      if (CAM.det) { const r = await CAM.det.detect(v); if (r && r.length) return acierto(r[0].rawValue); }
      else if (window.jsQR) { const t = leerQR(v, v.videoWidth, v.videoHeight); if (t) return acierto(t); }
    } catch (e) { CAM.det = null; }
  }

function leerQR(src, w, h) {
  const sc = Math.min(1, 720 / Math.max(w, h)), c = CAM.cv || (CAM.cv = document.createElement('canvas'));
  c.width = Math.round(w * sc); c.height = Math.round(h * sc);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(src, 0, 0, c.width, c.height);
  const r = jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
  return r && r.data ? r.data : '';
}
function acierto(t) { try { navigator.vibrate && navigator.vibrate(80); } catch (e) {} const c = SCB; cerrarScanner(); if (c) c(String(t).trim()); }
function pararCam() {
  clearTimeout(CAM.t);
  if (CAM.stream) { CAM.stream.getTracks().forEach(t => t.stop()); CAM.stream = null; }
  const v = $('vid'); if (v) v.srcObject = null; CAM.torch = false;
}
function cerrarScanner() { $('modal').classList.remove('on'); pararCam(); }
function camError(e) {
  pararCam();
  const n = e && e.name || '', m = String(e && e.message || '');
  let txt;
  if (/policy|feature/i.test(m)) txt = 'El navegador no deja usar la cámara dentro de la app.';
  else if (n === 'NotAllowedError' || n === 'SecurityError') txt = 'La cámara está bloqueada. Tocá el candado de la barra de direcciones → Permisos → Cámara → Permitir, y probá de nuevo.';
  else if (n === 'NotFoundError' || n === 'OverconstrainedError' || n === 'DevicesNotFoundError') txt = 'No se encontró una cámara en este equipo.';
  else if (n === 'NotReadableError' || n === 'TrackStartError') txt = 'Otra app está usando la cámara. Cerrala y probá de nuevo.';
  else if (n === 'SinSoporte') txt = 'Este navegador no permite usar la cámara. Usá Chrome actualizado.';
  else txt = 'No se pudo abrir la cámara.';
  if (n === 'NotAllowedError' || n === 'SecurityError' || /policy|feature/i.test(m)) guardar('scan_ventana', 1);
  scanMsg(txt + ' (' + (n || 'error') + ') Tocá "Abrir la cámara en otra ventana". Desde ahora se abre así directamente.');

}

function scanFoto(inp) {
  const f = inp.files && inp.files[0]; inp.value = ''; if (!f) return;
  scanMsg('Leyendo la foto…');
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = async () => {
    let t = '';
    try {
      if ('BarcodeDetector' in window) { const r = await new BarcodeDetector().detect(img); if (r && r.length) t = r[0].rawValue; }
      if (!t && window.jsQR) t = leerQR(img, img.naturalWidth, img.naturalHeight);

function abrirNP(np) {

  run('buscarNP', np).then(r => {

function repartir(pend, sug) {

  if (!picks.length) picks.push({ u: '', q: pend || '' });
  return picks;
}

  const C = S.cnt;
  render(head('Conteo') + `<div class="card">${campo('Ubicación a contar', 'cu', C.u, 'setCntU(this.value)')}<div class="desc" id="cud">${esc(C.ud)}</div>
    <p class="muted" style="margin-bottom:0">Cargá todo lo que hay en la ubicación. Lo que no cargues queda en cero.</p></div>
    ${C.lineas.map((l, i) => `<div class="line">${i > 0 ? `<button class="x" onclick="S.cnt.lineas.splice(${i},1);guardar('cnt',S.cnt);pintarCnt()" aria-label="Quitar"><i class="ti ti-x"></i></button>` : ''}
      ${campo('Artículo', 'ca' + i, l.a, `setCntA(${i},this.value)`, 'inputmode="numeric"')}<div class="desc" id="ca${i}d">${esc(l.d)}</div>
      <label class="lb">Cantidad contada</label><input type="number" inputmode="decimal" min="0" step="any" value="${esc(l.q)}" onchange="S.cnt.lineas[${i}].q=this.value;guardar('cnt',S.cnt)"></div>`).join('')}
    <button class="add" onclick="S.cnt.lineas.push({a:'',d:'',q:''});guardar('cnt',S.cnt);pintarCnt()"><i class="ti ti-plus"></i> Agregar otro artículo</button>
    <div id="err"></div><button class="primary" onclick="confirmarCnt(this)">Confirmar conteo</button>`);
}
function setCntU(v) { const C = S.cnt; C.u = up(v); C.ud = ''; $('cu').value = C.u; descUbi(C.u, d => { C.ud = d; const el = $('cud'); if (el) el.textContent = d; guardar('cnt', C); }); guardar('cnt', C); }
function setCntA(i, v) { const l = S.cnt.lineas[i]; l.a = String(v).trim(); l.d = ''; descArt(l.a, d => { l.d = d; const el = $('ca' + i + 'd'); if (el) el.textContent = d; guardar('cnt', S.cnt); }); }
function confirmarCnt(btn) {
  const C = S.cnt; btn.disabled = true;
  run('confirmarOperacion', { tipo: 'CONTEO', ubicacion: C.u, lineas: C.lineas.map(l => ({ articulo: l.a, cantidad: l.q === '' ? NaN : Number(l.q) })).filter(l => l.articulo || l.cantidad > 0) })
    .then(r => {
      if (!r.ok) { btn.disabled = false; return mostrarErr(r.errores); }
      borrar('cnt');
      render(head('Conteo') + `<div class="okbox">Conteo de ${esc(C.u)} registrado.</div><div class="card">${tabla([['Artículo'], ['Antes', 'n'], ['Contado', 'n'], ['Diferencia', 'n']],
        (r.detalle || []).map(x => [esc(x.a + ' · ' + x.d), fmt(x.antes), fmt(x.contado), x.dif ? `<span class="tag ${x.dif > 0 ? 't-ok' : 't-er'}">${x.dif > 0 ? '+' : ''}${fmt(x.dif)}</span>` : '0']))}</div>
        <button class="primary" onclick="vConteo()">Contar otra ubicación</button><button class="sec" onclick="home()">Volver al inicio</button>`);
    }).catch(e => { btn.disabled = false; mostrarErr([e.message]); });
}

/* ---------------- Mis movimientos ---------------- */
function vMisMov() {
  render(head('Mis movimientos de hoy') + '<p class="muted">Cargando…</p>');
  run('getMisMovimientos').then(list => {
    render(head('Mis movimientos de hoy') + (list.length ? list.map(m => `<div class="card"><div style="display:flex;justify-content:space-between"><b>${esc(m.tipo)}</b><span class="muted">${esc(m.hora)}</span></div>
      <div>${esc(m.a)} · ${esc(m.d)}</div><div class="muted">${fmt(m.q)} · ${esc(m.o || '—')} → ${esc(m.dst || '—')}${m.ref ? ' · ' + esc(m.ref) : ''}</div></div>`).join('') : '<p class="muted">Todavía no registraste movimientos hoy.</p>'));
  }).catch(e => render(head('Mis movimientos de hoy') + `<div class="errbox">${esc(e.message)}</div>`));
}

/* ---------------- Panel de administración ---------------- */
function adminHome(sec) {
  S.modo = 'admin'; pintarWho();
  const secs = ADMIN_SECS.filter(s => has(s[0]));
  if (!secs.length) return home();
  sec = sec && has(sec) ? sec : (S.adminSec && has(S.adminSec) ? S.adminSec : secs[0][0]);
  S.adminSec = sec;
  render(`<div class="adm"><nav class="side">${secs.map(s => `<button class="si ${s[0] === sec ? 'sel' : ''}" onclick="adminHome('${s[0]}')"><i class="ti ${s[2]}"></i><span>${s[1]}</span></button>`).join('')}</nav>
    <section id="pane"><p class="muted">Cargando…</p></section></div>`);
  ({ encurso: aEnCurso, pedidos: aPedidos, operarios: aOperarios, ubicaciones: aUbic, movimientos: aMov, diferencias: aDif, alertas: aAlertas, config: aConfig })[sec]();
}
function pane(h) { const el = $('pane'); if (el) el.innerHTML = h; }
function paneErr(e) { pane(`<div class="errbox">${esc(e.message)}</div>`); }
function filtrosFecha(fn) {
  const h = hoyISO(), d = hoyISO(new Date(Date.now() - 30 * 86400000));
  return `<div class="filters"><div><label class="lb">Desde</label><input type="date" id="fd" value="${d}"></div><div><label class="lb">Hasta</label><input type="date" id="fh" value="${h}"></div><button class="btn" style="height:44px" onclick="${fn}()">Ver</button></div><div id="res"></div>`;
}

function aEnCurso() {
  const load = () => run('getEnCurso').then(r => {
    if (S.adminSec !== 'encurso') return;
    pane(kpis([['En preparación', r.enCurso.length], ['Terminados hoy', r.terminadosHoy], ['Demorados', r.demorados, r.demorados ? 'color:#A32D2D' : '']]) +
      `<div class="card"><h3>Pedidos en curso</h3>${tabla([['NP'], ['Cliente'], ['Operario'], ['Tiempo', 'n'], ['Estado']],
        r.enCurso.map(p => [esc(p.np), esc(p.cliente), esc(p.operario), minTxt(p.min), p.demorado ? '<span class="tag t-er">Demorado</span>' : '<span class="tag t-ok">En curso</span>']))}
        <p class="muted" style="margin-bottom:0">Se considera demorado a partir de ${minTxt(r.limite)}. Se actualiza solo cada minuto.</p></div>`);
  }).catch(paneErr);
  load(); S.timers.push(setInterval(load, 60000));
}

function aPedidos() { pane(filtrosFecha('cargarPedidos')); cargarPedidos(); }
function cargarPedidos() {
  $('res').innerHTML = '<p class="muted">Cargando…</p>';
  run('getPedidos', $('fd').value, $('fh').value).then(r => {
    const max = Math.max(1, ...r.porDia.map(x => x[1]));
    $('res').innerHTML = kpis([['Pedidos terminados', fmt(r.terminados)], ['Tiempo medio de armado', minTxt(r.promedio)], ['Demorados', r.demorados, r.demorados ? 'color:#A32D2D' : '']]) +
      `<div class="card"><h3>Pedidos terminados por día</h3><div class="bars">${r.porDia.map(x => `<div title="${esc(x[0])}: ${x[1]}" style="height:${Math.round(x[1] / max * 100)}%"></div>`).join('') || '<p class="muted">Sin datos.</p>'}</div></div>
      <div class="card"><h3>Historial</h3>${tabla([['NP'], ['Cliente'], ['Operario'], ['Inicio'], ['Tiempo', 'n'], ['Destino'], ['Estado']],
        r.lista.map(p => [esc(p.np), esc(p.cliente), esc(p.operario), esc(p.inicio), minTxt(p.min), esc(p.destino), `<span class="tag ${p.estado === 'TERMINADO' ? (p.min > r.limite ? 't-wn' : 't-ok') : p.estado === 'CANCELADO' ? 't-mu' : 't-er'}">${esc(p.estado.replace('_', ' ').toLowerCase())}</span>`]))}</div>`;
  }).catch(e => { $('res').innerHTML = `<div class="errbox">${esc(e.message)}</div>`; });
}

function aOperarios() { pane(filtrosFecha('cargarOperarios')); cargarOperarios(); }
function cargarOperarios() {
  $('res').innerHTML = '<p class="muted">Cargando…</p>';
  run('getOperarios', $('fd').value, $('fh').value).then(r => {
    $('res').innerHTML = `<div class="card"><h3>Desempeño por operario</h3>${tabla([['Operario'], ['Pedidos', 'n'], ['Tiempo medio', 'n'], ['Demorados', 'n'], ['Ingresos', 'n'], ['Salidas', 'n'], ['Traslados', 'n'], ['Movimientos', 'n'], ['Ajustes', 'n'], ['Unidades', 'n']],
      r.lista.map(o => [esc(o.nombre), fmt(o.pedidos), o.pedidos ? minTxt(o.promedio) : '—', o.demorados ? `<span class="tag t-er">${o.demorados}</span>` : '0', fmt(o.INGRESO), fmt(o.SALIDA), fmt(o.TRASLADO), fmt(o.MOVER), fmt(o.AJUSTE), fmt(o.unidades)]))}</div>`;
  }).catch(e => { $('res').innerHTML = `<div class="errbox">${esc(e.message)}</div>`; });
}

function aUbic() {
  run('getUbicaciones').then(r => {
    S.ubicLista = r.lista;
    const tot = r.lista.length, occ = r.lista.filter(x => x.items).length;
    pane(kpis([['Ubicaciones', fmt(tot)], ['Ocupadas', fmt(occ)], ['Libres', fmt(tot - occ)], ['Ocupación', tot ? Math.round(occ / tot * 100) + '%' : '—']]) +
      `<div class="kpis">${r.sectores.map(s => `<div class="kpi"><p class="kl">${esc(s.nombre || s.sector)} · PB-${esc(s.sector)}</p><p class="kv" style="font-size:20px">${s.ocupadas} / ${s.total}</p><div class="occ"><div style="width:${s.total ? Math.round(s.ocupadas / s.total * 100) : 0}%"></div></div></div>`).join('')}</div>
      <div class="card"><div class="filters"><div style="flex:1"><label class="lb">Buscar</label><input id="uf" placeholder="Código, por ejemplo PB-PK-G" oninput="filtrarUbic()"></div>
      <div><label class="lb">Mostrar</label><select id="uo" onchange="filtrarUbic()"><option value="">Todas</option><option value="1">Ocupadas</option><option value="0">Libres</option></select></div></div><div id="ul"></div><div id="ud"></div></div>`);
    filtrarUbic();
  }).catch(paneErr);
}
function filtrarUbic() {
  const t = up($('uf').value), o = $('uo').value;
  const l = S.ubicLista.filter(x => (!t || x.c.indexOf(t) >= 0) && (o === '' || (o === '1' ? x.items : !x.items)));
  $('ul').innerHTML = tabla([['Ubicación'], ['Sector'], ['Tipo'], ['Artículos', 'n'], ['Cantidad', 'n'], ['']],
    l.slice(0, 300).map(x => [esc(x.c), esc(x.s), esc(x.t), x.items || '—', x.items ? fmt(x.q) : '—', `<button class="btn" onclick="verUbic('${esc(x.c)}')">Ver</button> <button class="btn" onclick="etiquetaDe('${esc(x.c)}')"><i class="ti ti-printer"></i></button>`])) +
    (l.length > 300 ? `<p class="muted">Se muestran 300 de ${fmt(l.length)}. Afiná la búsqueda.</p>` : '');
}
function verUbic(c) { $('ud').innerHTML = '<p class="muted">Cargando…</p>'; run('infoUbicacion', c).then(u => { $('ud').innerHTML = htmlUbic(u); $('ud').scrollIntoView({ behavior: 'smooth' }); }).catch(e => { $('ud').innerHTML = `<div class="errbox">${esc(e.message)}</div>`; }); }
function etiquetaDe(c) { run('infoUbicacion', c).then(imprimirEtiqueta).catch(e => toast(e.message, 'err')); }

function aMov() {
  pane(`<div class="filters"><div style="flex:1"><label class="lb">Buscar</label><input id="mf" placeholder="Artículo, ubicación, NP, operario…" onkeydown="if(event.key==='Enter')cargarMov()"></div><button class="btn" style="height:44px" onclick="cargarMov()">Buscar</button></div><div id="res"></div>`);
  cargarMov();
}
function cargarMov() {
  $('res').innerHTML = '<p class="muted">Cargando…</p>';
  run('getMovimientos', $('mf').value).then(l => {
    $('res').innerHTML = `<div class="card">${tabla([['Fecha'], ['Usuario'], ['Tipo'], ['Artículo'], ['Cantidad', 'n'], ['Desde'], ['Hacia'], ['Referencia']],
      l.map(m => [esc(m.fecha), esc(m.usuario), esc(m.tipo), esc(m.a + (m.d ? ' · ' + m.d : '')), fmt(m.q), esc(m.o), esc(m.dst), esc((m.dt ? m.dt + ' ' : '') + (m.ref || ''))]))}<p class="muted" style="margin-bottom:0">Últimos 300 movimientos.</p></div>`;
  }).catch(e => { $('res').innerHTML = `<div class="errbox">${esc(e.message)}</div>`; });
}

function aDif() {
  pane(`<div class="card"><h3>Diferencias con el ERP</h3><p class="muted">Compara el total por artículo que suman las ubicaciones con el stock del ERP. Mientras no esté hecha la carga inicial, van a aparecer casi todos los artículos.</p>
    <button class="btn" onclick="cargarDif(this)">Calcular diferencias</button></div><div id="res"></div>`);
}
function cargarDif(btn) {
  btn.disabled = true; $('res').innerHTML = '<p class="muted">Leyendo el ERP…</p>';
  run('getDiferencias').then(r => {
    btn.disabled = false;
    $('res').innerHTML = `<div class="card"><p class="muted">${fmt(r.total)} artículos con diferencia · depósitos del ERP: ${esc(r.depositos)}</p>${tabla([['Artículo'], ['Descripción'], ['ERP', 'n'], ['Ubicaciones', 'n'], ['Diferencia', 'n']],
      r.rows.map(x => [esc(x.a), esc(x.d), fmt(x.erp), fmt(x.app), `<span class="tag ${x.dif > 0 ? 't-ok' : 't-er'}">${x.dif > 0 ? '+' : ''}${fmt(x.dif)}</span>`]))}</div>`;
  }).catch(e => { btn.disabled = false; $('res').innerHTML = `<div class="errbox">${esc(e.message)}</div>`; });
}

function aAlertas() {
  run('getAlertas').then(r => {
    pane(kpis([['Pedidos demorados', r.demorados.length, r.demorados.length ? 'color:#A32D2D' : ''], [`Ubicaciones sin movimiento (+${r.dias} días)`, r.sinMovimiento.length], ['Artículos con diferencia ERP', r.diferencias == null ? '—' : fmt(r.diferencias)]]) +
      (r.art ? `<div class="warn">${esc(r.art)}</div>` : '') +
      `<div class="card"><h3>Pedidos demorados</h3>${tabla([['NP'], ['Cliente'], ['Operario'], ['Tiempo', 'n']], r.demorados.map(p => [esc(p.np), esc(p.cliente), esc(p.operario), minTxt(p.min)]))}</div>
      <div class="card"><h3>Ubicaciones sin movimiento</h3>${tabla([['Ubicación'], ['Artículos', 'n'], ['Último movimiento']], r.sinMovimiento.map(x => [esc(x.u), x.items, esc(x.ultima)]))}</div>`);
  }).catch(paneErr);
}

function aConfig() {
  run('getConfig').then(r => {
    pane(`<div class="card"><h3>Artículos (ART)</h3><p>Última actualización desde el ERP: <b>${esc(r.ultimaSyncArt || 'nunca')}</b></p>
      <p class="muted">Se actualiza sola cada hora${r.activadores ? '' : ' — <b style="color:#A32D2D">el activador no está instalado; ejecutá setup()</b>'}.</p>
      <button class="btn" onclick="syncAhora(this)"><i class="ti ti-refresh"></i> Sincronizar ahora</button></div>
      <div class="card"><h3>Usuarios</h3>${tabla([['Email'], ['Nombre'], ['Rol'], ['Activo']], r.usuarios.map(u => [esc(u.email), esc(u.nombre), esc(u.rol), esc(u.activo)]))}
      <p class="muted" style="margin-bottom:0">Para agregar o quitar usuarios, editá la hoja USUARIOS. Roles: ADMIN, ADMIN_DEP, ADMIN_LITE, OPERARIO.</p></div>
      <div class="card"><h3>Planilla</h3><a href="${esc(r.url)}" target="_blank">Abrir la planilla de la app</a></div>`);
  }).catch(paneErr);
}
function syncAhora(btn) {
  btn.disabled = true;
  run('sincronizarAhora').then(r => { toast(fmt(r.filas) + ' artículos actualizados', 'ok'); aConfig(); }).catch(e => { btn.disabled = false; toast(e.message, 'err'); });
}

/* ---------------- Etiqueta (Zebra 99 × 59 mm) ---------------- */
function imprimirEtiqueta(u) {
  if (!u) return;
  if (typeof QRCode === 'undefined') return toast('No cargó el generador de QR. Recargá la página.', 'err');
  const blo = u.p === '0', down = u.fl === 'Abajo';
  const caps = blo ? ['BLOQUE', 'LUGAR', 'POS.'] : ['RACK', 'ESTANTERÍA', 'POSICIÓN'];
  const msg = blo ? 'PISO' + (u.cap ? ' · HASTA ' + u.cap + ' PALLETS' : '') : (down ? '▼ POSICIÓN DEBAJO DE ESTA ETIQUETA ▼' : '▲ POSICIÓN ARRIBA DE ESTA ETIQUETA ▲');
  const pts = down ? '3.5,0 6.5,0 6.5,17 9.5,17 5,28 0.5,17 3.5,17' : '3.5,28 6.5,28 6.5,11 9.5,11 5,0 0.5,11 3.5,11';
  $('print').innerHTML = `<div class="lbl"><div class="lh"><span>${esc(String(u.sn || '').toUpperCase())}</span><span>PB-${esc(u.s)}</span></div>
    <div class="lm"><div class="lq" id="lq"></div><div class="lr"><div class="segs">${[[caps[0], u.r], [caps[1], u.e], [caps[2], u.p]].map(x => `<div class="sg"><div class="sc">${x[0]}</div><div class="sv">${esc(x[1])}</div></div>`).join('')}</div>
    <div class="lc">${esc(u.c)}</div></div>${blo ? '' : `<svg class="arr" viewBox="0 0 10 28"><polygon points="${pts}"/></svg>`}</div><div class="lf">${esc(msg)}</div></div>`;
  new QRCode($('lq'), { text: u.c, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
  setTimeout(() => window.print(), 450);
}
</script>
</body>
